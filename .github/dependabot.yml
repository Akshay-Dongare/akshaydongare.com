# Weekly dependency pull requests. CI runs lint, types and tests on each one and Vercel builds a preview, so a bump
# that breaks something arrives red rather than on main. The notes under Commands in AGENTS.md say why the groups are
# what they are.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release waits a week before it is proposed: compromised npm versions have been found and pulled within days.
    # Security updates skip the wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # A dependency joins the first group it matches, so the sets that must move together come first, majors
      # included. Version updates keep eslint-config-next on next's version; a security update moves next alone.
      next:
        patterns: [next, eslint-config-next]
      # R3F's peer range caps React's minor, and npm only warns when it breaks.
      react:
        patterns: [react, react-dom, "@types/react", "@types/react-dom", "@react-three/*"]
      three:
        patterns: [three, "@types/three"]
      # Everything else shares one pull request and its majors come one at a time. A package whose newest release is
      # a major leaves this group entirely, which is why the majors below are ignored.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Follows the Node major the site builds on, which changes by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # eslint-config-next's plugins cap eslint at ^9, and typescript-eslint caps TypeScript below 6. Drop each rule
      # once its range opens.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # framer-motion 13 and 14 add 6.3KB gzipped to every page's first load, over the JS budget, and nothing the site
      # uses; 12.x keeps arriving in minor-and-patch. Drop this rule when a major is worth its bytes.
      - dependency-name: framer-motion
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
